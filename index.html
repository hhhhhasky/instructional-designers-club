<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        function showLoadError() {
          const message = document.getElementById("site-load-error");
          if (message) {
            message.hidden = false;
          } else {
            document.addEventListener("DOMContentLoaded", showLoadError, { once: true });
          }
        }

        window.addEventListener("vite:preloadError", showLoadError);
        window.addEventListener("error", (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement && target.type === "module") {
            showLoadError();
          } else if (target instanceof HTMLLinkElement && target.rel === "stylesheet") {
            const url = new URL(target.href);
            if (url.origin === location.origin && url.pathname.startsWith("/assets/")) {
              showLoadError();
            }
          }
        }, true);
        document.addEventListener("DOMContentLoaded", () => {
          document.getElementById("site-reload").addEventListener("click", () => location.reload());
        }, { once: true });
        window.addEventListener("load", () => {
          const font = document.createElement("link");
          font.rel = "stylesheet";
          font.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap";
          document.head.append(font);
        }, { once: true });
      })();
    </script>
    <style>
      #site-load-error:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        padding: 24px;
        background: #faf8f2;
        color: #26332b;
        text-align: center;
        font: 16px/1.6 system-ui, sans-serif;
      }
      #site-load-error p { margin: 0; }
      #site-reload {
        padding: 8px 16px;
        border: 1px solid #3d5f4b;
        border-radius: 6px;
        background: #3d5f4b;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      .home-initial-hero {
        padding: 64px 24px 56px;
        background: #faf8f2;
        color: #26332b;
        font-family: system-ui, sans-serif;
      }
      .home-initial-hero > div { max-width: 1152px; margin: auto; }
      .home-initial-kicker { color: #3d5f4b; font-size: 13px; font-weight: 700; }
      .home-initial-hero h1 { margin: 20px 0; font-size: clamp(32px, 5vw, 60px); line-height: 1.22; font-weight: 900; }
      .home-initial-hero h1 span { color: #3d5f4b; }
      .home-initial-description { max-width: 640px; font-size: 16px; line-height: 1.75; }
      .home-initial-hero a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        border-radius: 6px;
        background: #3d5f4b;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
    <title>哈老师聊教学设计</title>

    <meta name="keywords" content="哈老师聊教学设计,教师培训,教学设计,教师AI课,道法教材解读课" />
    <meta property="og:title" content="哈老师聊教学设计" />
    <meta property="og:description" content="从真实教学问题出发，和哈老师一起分析教材、学情、目标、课堂活动与评价。了解教学通识课、教师 AI 课和道法教材解读课。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://idclub.hasky.top" />
    <meta property="og:image" content="https://idclub.hasky.top/og-default.png" />

    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="哈老师聊教学设计" />
    <meta name="twitter:description" content="从真实教学问题出发，和哈老师一起分析教材、学情、目标、课堂活动与评价。了解教学通识课、教师 AI 课和道法教材解读课。" />
    <link rel="canonical" href="https://idclub.hasky.top" />
  </head>
  <body>
    <div id="root">
      <div id="home-initial-hero" hidden><!-- home-initial-hero --></div>
    </div>
    <script>
      if (location.pathname === "/" && !location.hash.startsWith("#/")) {
        document.getElementById("home-initial-hero").hidden = false;
      }
    </script>
    <div id="site-load-error" role="alert" hidden>
      <p>页面暂时未能加载，请刷新重试。</p>
      <button id="site-reload" type="button">重新加载</button>
      <p>如果仍然打不开，请尝试强制刷新或使用无痕窗口。</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
